<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{signIn}} · {{product}}</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:15px/1.5 system-ui,-apple-system,sans-serif;color:#111;background:#f6f6f6;padding:16px;box-sizing:border-box}
  .box{max-width:420px;background:#fff;border:1px solid #e3e3e3;border-radius:12px;padding:20px}
  a{color:inherit}
</style></head>
<body>
<div class="box"><p id="msg">{{signingIn}}</p><p id="bad" hidden>{{linkBad}} <a href="/projects">{{signIn}}</a></p></div>
<script>
// The email link lands here with the sign-in in the part after the #, which only this page sees;
// it goes to the server once, which answers with the session cookie, and the address bar is
// cleared of it.
(async () => {
  const hash = new URLSearchParams(location.hash.slice(1));
  const back = new URLSearchParams(location.search).get("back") || "/";
  history.replaceState(null, "", location.pathname + location.search);
  const token = hash.get("access_token");
  const fail = () => { document.getElementById("msg").hidden = true; document.getElementById("bad").hidden = false; };
  if (!token) return fail();
  const r = await fetch("/api/auth/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ access_token: token, back }) }).then((r) => r.json()).catch(() => ({}));
  if (!r.ok) return fail();
  location.replace(r.back || "/");
})();
</script>
</body></html>
