<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{connectTitle}} · {{product}}</title>
<style>
  :root{--line:#e3e3e3;--faint:#8a8a8a}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,sans-serif;color:#111;background:#f6f6f6}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
  a{color:inherit}
  .brand{font-weight:600;text-decoration:none}
  nav{display:flex;gap:14px;align-items:center;font-size:14px}
  nav .who{color:var(--faint)}
  main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:22px;margin:0 0 6px}
  .lead{color:#444;margin:0 0 22px}
  section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
  section p{margin:0 0 10px}
  .row{display:flex;gap:8px;align-items:flex-start}
  code{flex:1;display:block;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f4f4f4;border:1px solid var(--line);
    border-radius:6px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
  button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid #111;background:#111;color:#fff;cursor:pointer;white-space:nowrap}
  .small{color:var(--faint);font-size:13px;margin:0}
  .signin{max-width:420px;margin:12vh auto 0}
  .signin form{display:flex;gap:8px}
  .signin input{flex:1;font:inherit;padding:7px 10px;border:1px solid #ccc;border-radius:8px}
  .note{margin-top:10px;font-size:13px;color:#555;min-height:18px}
</style></head>
<body>
<header>
  <a class="brand" href="/">{{product}}</a>
  <nav><a href="/projects">{{projects}}</a><span class="who">{{account}}</span></nav>
</header>
<main data-signed-in="{{signedIn}}">
  <div id="mine" hidden>
    <h1>{{connectTitle}}</h1>
    <p class="lead">{{connectLead}}</p>
    <section>
      <p>{{connectAdd}}</p>
      <div class="row"><code id="command">{{command}}</code><button type="button" data-copy="command">{{copy}}</button></div>
    </section>
    <section>
      <p>{{connectWatch}}</p>
      <div class="row"><code id="watch">{{watch}}</code><button type="button" data-copy="watch">{{copy}}</button></div>
    </section>
    <p class="small">{{connectPrivate}}</p>
  </div>
  <section class="signin" id="signin" hidden>
    <p>{{connectSignIn}}</p>
    <form id="form"><input id="email" type="email" placeholder="{{email}}" autocomplete="email" required><button type="submit">{{sendLink}}</button></form>
    <div class="note" id="note"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
if (document.querySelector("main").dataset.signedIn) $("mine").hidden = false;
else {
  $("signin").hidden = false;
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("note").textContent = "…";
    const r = await fetch("/api/auth/link", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: $("email").value, back: "/connect" }) }).then((r) => r.json());
    $("note").textContent = r.note;
  });
}
for (const b of document.querySelectorAll("[data-copy]")) b.onclick = async () => {
  try { await navigator.clipboard.writeText($(b.dataset.copy).textContent); b.textContent = "✓"; } catch {}
};
</script>
</body></html>
