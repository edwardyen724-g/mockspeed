<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sign in to mockspeed</title>
</head>
<body style="margin:0;padding:0;background:#f6f6f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f6f6;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
        <tr>
          <td style="padding:0 4px 14px;font:600 15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111;">mockspeed</td>
        </tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #e3e3e3;border-radius:12px;padding:28px 24px;font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111;">
            <p style="margin:0 0 20px;">Here's your link to sign in. It brings you back to your mock.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-radius:8px;background:#111;">
                  <a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:10px 18px;border:1px solid #111;border-radius:8px;font:14px/1.2 system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#ffffff;text-decoration:none;">Sign in to mockspeed</a>
                </td>
              </tr>
            </table>
            <p style="margin:20px 0 0;color:#555;font-size:14px;">The link works once, for an hour. If you didn't ask for it, you can ignore this email.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 4px 0;font:13px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#8a8a8a;">Sent to {{ .Email }} because someone asked to sign in to mockspeed with it.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
